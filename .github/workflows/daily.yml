name: Prijzen ophalen

on:
  schedule:
    # De day-ahead prijzen voor morgen verschijnen rond 12u45-13u Brusselse tijd.
    # GitHub start geplande runs soms uren te laat, vooral op ronde minuten.
    # Daarom meerdere runs per dag op "rustige" minuten; elke run werkt alles bij
    # en slaat alleen op als er iets veranderd is.
    - cron: "7 12 * * *"
    - cron: "37 12 * * *"
    - cron: "11 13 * * *"
    - cron: "43 14 * * *"
    - cron: "29 17 * * *"
    - cron: "53 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = laatste dagen bijwerken, backfill = historiek ophalen"
        type: choice
        options: [daily, backfill]
        default: daily
      source:
        description: "Welke gegevens"
        type: choice
        options: [all, dayahead, imbalance, weather, aws, solar, gas, mazout]
        default: all
      start:
        description: "Startdatum JJJJ-MM-DD (leeg = standaard)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: prijzen
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Prijzen ophalen
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          MODE: ${{ inputs.mode || 'daily' }}
          SOURCE: ${{ inputs.source || 'all' }}
          START: ${{ inputs.start }}
        run: |
          args=("$MODE" --source "$SOURCE")
          if [ -n "$START" ]; then args+=(--start "$START"); fi
          python fetch_prices.py "${args[@]}"

      - name: Wijzigingen opslaan
        # Ook na een fout of time-out bewaren wat al binnen is.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Geen nieuwe gegevens."
          else
            git commit -m "Prijzen bijgewerkt $(date -u +%Y-%m-%d)"
            # Werd er intussen iets geüpload, neem dat eerst mee.
            git pull --rebase origin main
            git push
          fi
